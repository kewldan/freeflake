[package]
name = "freeflake"
description = "Free, open-source snow on your desktop, with an advent Christmas tree"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
auto-launch = "0.6"
chrono.workspace = true
directories.workspace = true
env_logger.workspace = true
freeflake-core.workspace = true
freeflake-platform.workspace = true
freeflake-render.workspace = true
egui = { version = "0.37", features = ["default_fonts"] }
egui-wgpu = "0.37"
egui-winit = "0.37"
glam.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
sys-locale = "0.3"
toml.workspace = true
winit = "0.30"

[target.'cfg(not(target_os = "linux"))'.dependencies]
tray-icon = "0.26"

[target.'cfg(target_os = "linux")'.dependencies]
# StatusNotifierItem over D-Bus: no GTK needed.
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }
