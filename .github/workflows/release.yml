name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-14 }
          - { target: x86_64-apple-darwin, os: macos-14 }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }} -p freeflake
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          name="freeflake-${version}-${{ matrix.target }}"
          bin="target/${{ matrix.target }}/release/freeflake"
          mkdir -p dist
          case "${{ matrix.target }}" in
            *windows*)
              mkdir "$name" && cp "$bin.exe" README.md LICENSE "$name/"
              7z a "dist/$name.zip" "$name" >/dev/null
              ;;
            *apple*)
              mkdir "$name" && cp "$bin" README.md LICENSE "$name/"
              tar -czf "dist/$name.tar.gz" "$name"
              app="freeflake.app"
              mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
              cp "$bin" "$app/Contents/MacOS/freeflake"
              cp packaging/macos/AppIcon.icns "$app/Contents/Resources/"
              sed "s/@VERSION@/${version}/g" packaging/macos/Info.plist > "$app/Contents/Info.plist"
              ditto -c -k --keepParent "$app" "dist/freeflake-${version}-${{ matrix.target }}.app.zip"
              ;;
            *)
              mkdir "$name" && cp "$bin" README.md LICENSE "$name/"
              tar -czf "dist/$name.tar.gz" "$name"
              ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
      - name: Update Homebrew tap
        if: ${{ env.TAP_TOKEN != '' }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          sha() { grep " freeflake-${version}-$1.tar.gz$" dist/SHA256SUMS | cut -d' ' -f1; }
          sed -e "s/@VERSION@/${version}/g" \
              -e "s/@SHA_MAC_ARM@/$(sha aarch64-apple-darwin)/" \
              -e "s/@SHA_MAC_X86@/$(sha x86_64-apple-darwin)/" \
              -e "s/@SHA_LINUX_ARM@/$(sha aarch64-unknown-linux-gnu)/" \
              -e "s/@SHA_LINUX_X86@/$(sha x86_64-unknown-linux-gnu)/" \
              packaging/homebrew/freeflake.rb > freeflake.rb
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/kewldan/homebrew-tap.git" tap
          mkdir -p tap/Formula && cp freeflake.rb tap/Formula/
          cd tap
          git config user.name kewldan
          git config user.email kewldanil1@gmail.com
          git add Formula/freeflake.rb
          git commit -m "freeflake ${version}"
          git push
